# ==============================================================================
# Upstream Definitions
# In Docker Compose, service names resolve via Docker internal DNS.
# On a host Nginx deployment, use 127.0.0.1:3000 and 127.0.0.1:1337.
# ==============================================================================
upstream storefront_upstream {
    server storefront:3000;
    keepalive 32;
}

upstream cms_upstream {
    server cms:1337;
    keepalive 16;
}

# ==============================================================================
# HTTP: ACME Challenge & Global HTTPS Redirection
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name ateevra.com www.ateevra.com cms.ateevra.com;

    # Let's Encrypt ACME verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# HTTPS: Primary Storefront & BFF Application (ateevra.com, www.ateevra.com)
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ateevra.com www.ateevra.com;

    # TLS Certificates (Certbot Let's Encrypt or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/ateevra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ateevra.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Next.js Static Optimization Assets Caching
    location /_next/static/ {
        proxy_pass http://storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files in Storefront
    location ~* \.(jpg|jpeg|png|webp|svg|ico|css|js|woff|woff2)$ {
        proxy_pass http://storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # OTP Request Rate Limiting (Prevent SMS Flooding)
    location /api/auth/otp/request {
        limit_req zone=auth_otp_limit burst=3 nodelay;

        proxy_pass http://storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Razorpay Webhook Ingress (Must preserve raw body)
    location /api/webhooks/razorpay {
        proxy_pass http://storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 5M;
    }

    # Storefront General API Routes
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default Next.js Storefront Route
    location / {
        limit_req zone=general_limit burst=30 nodelay;

        proxy_pass http://storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ==============================================================================
# HTTPS: Protected Strapi CMS & Admin Surface (cms.ateevra.com)
# Protected by IP allowlist or private network restrictions
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.ateevra.com;

    ssl_certificate /etc/letsencrypt/live/ateevra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ateevra.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # Strapi Administrative Surface Protection (/admin)
    # Restricts administrative dashboard to localhost / loopback by default.
    # Public WAN traffic is denied (403 Forbidden).
    # On production VPS:
    # 1. Admin access via SSH tunnel: ssh -L 1337:127.0.0.1:1337 user@vps
    # 2. Or allow specific static IP: uncomment and set 'allow <ADMIN_STATIC_IP>;'
    # 3. Or protect via Cloudflare Zero Trust Access on cms.ateevra.com/admin
    # --------------------------------------------------------------------------
    location /admin {
        # Loopback / local access
        allow 127.0.0.1;
        allow ::1;
        # Production manual action: uncomment and replace with administrator/VPN static IP
        # allow <ADMIN_STATIC_IP>;
        deny all;

        proxy_pass http://cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Public CMS endpoints (Content API, Media Uploads, Healthcheck)
    location / {
        proxy_pass http://cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
